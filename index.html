<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXR Background with Click Zoom & Rotating Waterball</title>
<style>
    html, body { margin: 0; height: 100%; }
    canvas { display: block; }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 20, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    new THREE.EXRLoader()
        .setPath('./')
        .load('citrus_orchard_road_puresky_1k.exr',
            (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                scene.background = envMap;
                texture.dispose();
            }
        );

    const loader = new THREE.GLTFLoader();
    let picModel = null;
    let waterballModel = null;
    let doggModel = null;

    loader.load('Land.glb', (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        model.name = "Land";
        scene.add(model);
    });

    loader.load('picname.glb', (gltf) => {
        picModel = gltf.scene;
        picModel.scale.set(1,1,1);
        picModel.rotation.x = Math.PI / 2;
        picModel.position.set(0,10,0);
        picModel.name = "PicName";
        scene.add(picModel);
    });

    loader.load('waterball.glb', (gltf) => {
        waterballModel = gltf.scene;
        waterballModel.position.set(7.55,1.5,-1.85);
        waterballModel.name = "Waterball";
        scene.add(waterballModel);
    });

    loader.load('dogg.glb', (gltf) => {
        doggModel = gltf.scene;
        doggModel.position.set(1,2,1);
        doggModel.scale.set(1,1,1);
        doggModel.name = "Dogg";
        scene.add(doggModel);
    });

    const directionalLight = new THREE.DirectionalLight(0xffffff,1);
    directionalLight.position.set(5,10,5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isZooming = false;
    let targetCameraPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();
    const zoomSpeed = 0.05;

    function onClick(event){
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left)/rect.width)*2-1;
        mouse.y = -((event.clientY - rect.top)/rect.height)*2+1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children,true);

        if(intersects.length>0){
            const hit = intersects[0].object;

            // PicName → ซูมเข้า
            if(hit.name==="PicName" || (hit.parent && hit.parent.name==="PicName")){
                const box = new THREE.Box3().setFromObject(picModel);
                const center = box.getCenter(new THREE.Vector3());
                targetLookAt.copy(center);
                targetCameraPos.copy(center.clone().add(new THREE.Vector3(0,5,10)));
                isZooming = true;
            }

            // Waterball → ซูมเข้า
            if(hit.name==="Waterball" || (hit.parent && hit.parent.name==="Waterball")){
                const box = new THREE.Box3().setFromObject(waterballModel);
                const center = box.getCenter(new THREE.Vector3());
                targetLookAt.copy(center);
                targetCameraPos.copy(center.clone().add(new THREE.Vector3(0,5,10)));
                isZooming = true;
            }
        }
    }

    renderer.domElement.addEventListener('click',onClick);

    window.addEventListener('resize',()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(){
        requestAnimationFrame(animate);

        // หมุน Waterball ขึ้นลงแกน X
        if(waterballModel){
            waterballModel.rotation.x+=0.01;
            waterballModel.rotation.y=0;
            waterballModel.rotation.z=0;
        }

        if(isZooming){
            camera.position.lerp(targetCameraPos,zoomSpeed);
            controls.target.lerp(targetLookAt,zoomSpeed);
            controls.update();

            if(camera.position.distanceTo(targetCameraPos)<0.1){
                isZooming=false;
            }
        }

        controls.update();
        renderer.render(scene,camera);
    }

    animate();
</script>
</body>
</html>
