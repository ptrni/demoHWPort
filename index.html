<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXR Background with Plane</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        canvas {
            display: block;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
    <script>
        // Scene / Camera / Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 15); // ตั้งกล้องให้เห็นโมเดลเต็ม ๆ

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // PMREM Generator
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        // Load EXR and set as background
        new THREE.EXRLoader()
            .setPath('./')
            .load('citrus_orchard_road_puresky_1k.exr', (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                scene.background = envMap;
                texture.dispose();
                console.log("✅ EXR Loaded");
            }, undefined, (err) => {
                console.error("❌ EXR load error", err);
            });

        // Add Plane
        const planeGeometry = new THREE.PlaneGeometry(30, 30);
        const planeMaterial = new THREE.MeshStandardMaterial({
            color: 0x808080,
            roughness: 0.5,
            metalness: 0.5,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2; // วางราบกับพื้น
        plane.position.y = -1; // ขยับลงเล็กน้อย
        plane.receiveShadow = true;
        scene.add(plane);

        // Load GLB Model (กลางฉาก)
        const loader = new THREE.GLTFLoader();
        loader.load('floating_fantasy_island_diorama.glb', (gltf) => {
            const model = gltf.scene;
            model.position.set(0, 0, 0); // อยู่ตรงกลางฉาก
            model.rotation.set(0, 0, 0); // ไม่หมุนแกน
            model.scale.set(1, 1, 1);    // ปรับขนาดเท่าเดิม
            model.traverse((child) => {
                if (child.isMesh) child.castShadow = true;
            });
            scene.add(model);
            console.log("✅ GLB Model Loaded");
        }, undefined, (err) => {
            console.error("❌ GLB load error", err);
        });

        // Light
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Render loop
        function animate() {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>

</html>
