<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXR Background with Click Zoom</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
        }
        canvas {
            display: block;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
    // Scene / Camera / Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );
    camera.position.set(0, 20, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // PMREM Generator
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    // Load EXR and set as background
    new THREE.EXRLoader()
        .setPath('./')
        .load(
            'citrus_orchard_road_puresky_1k.exr',
            (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                scene.background = envMap;
                texture.dispose();
                console.log("✅ EXR Loaded");
            },
            undefined,
            (err) => {
                console.error("❌ EXR load error", err);
            }
        );

    // Loader สำหรับ GLB ตัวแรก
    const loader = new THREE.GLTFLoader();

    // โหลด Land.glb
    loader.load(
        'Land.glb',
        (gltf) => {
            const model = gltf.scene;
            model.position.set(0, 0, 0);
            model.name = "Land";
            scene.add(model);
            console.log("✅ Land.glb Loaded");
        },
        undefined,
        (err) => {
            console.error("❌ Land.glb load error", err);
        }
    );

    // โหลด picname.glb
    let picModel; // เก็บตัวโมเดลไว้ใช้ภายหลัง
    loader.load(
        'picname.glb',
        (gltf) => {
            picModel = gltf.scene;
            picModel.scale.set(1, 1, 1);
            picModel.rotation.x = Math.PI / 2;
            picModel.position.set(0, 10, 0);
            picModel.name = "PicName";
            scene.add(picModel);
            console.log("✅ picname.glb Loaded");
        },
        undefined,
        (err) => {
            console.error("❌ picname.glb load error", err);
        }
    );

     loader.load(
        'waterball.glb',
        (gltf) => {
            const model = gltf.scene;
            model.position.set(0, 10, 0);
            model.name = "Land";
            scene.add(model);
            console.log("✅ waterball.glb Loaded");
        },
        undefined,
        (err) => {
            console.error("❌ waterball.glb load error", err);
        }
    );
    // Add Light
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // Resize handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----- ระบบคลิกเพื่อซูมเข้า -----
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isZooming = false;
    let targetCameraPos = new THREE.Vector3();
    let targetLookAt = new THREE.Vector3();
    const zoomSpeed = 0.05; // ความนุ่มของซูม

    function onClick(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);

        if (intersects.length > 0) {
            const hit = intersects[0].object;
            console.log("✅ Clicked:", hit.name || hit);

            if (hit.name === "PicName" || (hit.parent && hit.parent.name === "PicName")) {
                const box = new THREE.Box3().setFromObject(picModel);
                const center = box.getCenter(new THREE.Vector3());

                // ตั้งตำแหน่งซูมเข้าใกล้ picname
                targetLookAt.copy(center);
                targetCameraPos.copy(center.clone().add(new THREE.Vector3(0, 5, 10)));
                isZooming = true;
            }
        }
    }

    renderer.domElement.addEventListener('click', onClick);

    // Render loop
    function animate() {
        requestAnimationFrame(animate);

        // ถ้ากำลังซูม
        if (isZooming) {
            camera.position.lerp(targetCameraPos, zoomSpeed);
            controls.target.lerp(targetLookAt, zoomSpeed);
            controls.update();

            if (camera.position.distanceTo(targetCameraPos) < 0.1) {
                isZooming = false;
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
