<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>GLB + EXR Background • three.js</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column; /* จัดเรียงแนวตั้ง */
      align-items: center; /* จัดให้อยู่ตรงกลางแนวนอน */
      background-color: black;
      color: white;
      font-family: sans-serif;
    }

    h1 {
      margin: 10px 0;
      text-align: center;
    }

    canvas {
      flex: 1; /* ให้ canvas ขยายเต็มที่ในพื้นที่ที่เหลือ */
      display: block;
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
</head>
<body>
  <h1>โมเดลทดสอบ: Mari.glb</h1>
  <canvas id="threeCanvas"></canvas>

  <script>
    const canvas = document.getElementById('threeCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
    renderer.setSize(window.innerWidth, window.innerHeight - 80); // เว้นพื้นที่ให้ชื่อด้านบน

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    const ambientLight = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    new THREE.EXRLoader()
      .setPath('./')
      .load('dikhololo_night_1k.exr', (texture) => {
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        scene.environment = envMap;
        scene.background = envMap;
        texture.dispose();
        console.log("✅ EXR Loaded");
      }, undefined, (err) => {
        console.error("❌ EXR load error", err);
      });

    const loader = new THREE.GLTFLoader();
    loader.load('Mari.glb', (gltf) => {
      const model = gltf.scene;
      model.scale.set(0.5, 0.5, 0.5);
      scene.add(model);
      console.log("✅ GLB Loaded");
    }, undefined, (err) => {
      console.error("❌ GLB load error", err);
    });

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight - 80);
    });

    (function loop() {
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
