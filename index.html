<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXR Background with Plane</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    canvas {
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <script>
    // Scene / Camera / Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 10, 20); // ยกกล้องขึ้นและซูมออก

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // เปิดการแสดงผลเงา
    document.body.appendChild(renderer.domElement);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // PMREM Generator
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    // Load EXR and set as background
    new THREE.EXRLoader()
      .setPath('./') // Path to EXR file
      .load('belfast_sunset_puresky_1k.exr', (texture) => {
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        scene.environment = envMap;
        scene.background = envMap;
        texture.dispose();
        console.log("✅ EXR Loaded");
      }, undefined, (err) => {
        console.error("❌ EXR load error", err);
      });

    // Add Plane (Stand upright)
    const planeGeometry = new THREE.PlaneGeometry(10, 10); // สร้าง Plane ขนาด 10x10
    const planeMaterial = new THREE.MeshStandardMaterial({
      color: 0x808080,
      roughness: 0.5,
      metalness: 0.5,
      side: THREE.DoubleSide,
      reflectivity: 0.8
    }); // สีเทาและตั้งค่าให้มีการสะท้อนเงา

    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = Math.PI / 2; // หมุน Plane ให้ยืนขึ้น
    plane.position.set(0, 2, 0); // ยก plane ขึ้น
    plane.receiveShadow = true; // เปิดการรับเงาของ plane
    scene.add(plane);

    // Load GLB Model
    const loader = new THREE.GLTFLoader();
    loader.load('name.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);
      model.position.set(0, 0, 0);
      console.log("✅ GLB Model Loaded");
    }, undefined, (err) => {
      console.error("❌ GLB load error", err);
    });

    // Add Light
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5); // ตำแหน่งของแสง
    directionalLight.castShadow = true; // เปิดการสร้างเงา
    scene.add(directionalLight);

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>

</html>
